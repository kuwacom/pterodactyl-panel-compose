services:
  mysql:
    image: mysql:8.4
    container_name: pterodactyl-mysql
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: "Asia/Tokyo"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USER}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    # MySQL 8.4 のデフォルト認証プラグイン caching_sha2_password は MariaDB クライアントが未サポートのため
    # mysql_native_password を使用する（mysql CLI でスキーマダンプを読み込む際に必要）
    command: --mysql-native-password=ON --authentication-policy=mysql_native_password
    # MySQL 8.4 公式イメージには healthcheck.sh が存在しない（MariaDB固有）。mysqladmin ping で生存確認する
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - ./mysql:/var/lib/mysql

  redis:
    image: redis:alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./redis:/data

  panel:
    image: ghcr.io/pterodactyl/panel:latest
    container_name: pterodactyl-panel
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: "Asia/Tokyo"
      APP_TIMEZONE: "Asia/Tokyo"
      CACHE_DRIVER: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_DRIVER: "redis"
      REDIS_HOST: "redis"
      TRUSTED_PROXIES: "127.0.0.1" # Cloudflare Tunnel経由で接続元IPを正確に取得するために必要 それ以外のproxyを追加する場合はipを追加
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - pterodactyl-app:/app
      - ./mysql-client.cnf:/root/.my.cnf:ro
    ports:
      - 127.0.0.1:8080:80

  queue:
    # Pterodactyl Queue Worker
    # `* * * * * php /var/www/pterodactyl/artisan schedule:run >> /dev/null 2>&1` こいつにあたる
    image: ghcr.io/pterodactyl/panel:latest
    container_name: pterodactyl-queue
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: "Asia/Tokyo"
      APP_TIMEZONE: "Asia/Tokyo"
      CACHE_DRIVER: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_DRIVER: "redis"
      REDIS_HOST: "redis"
    env_file:
      - .env
    depends_on:
      panel:
        condition: service_started
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3"]

  # nginx:
  #   image: jkaninda/nginx-php-fpm:8.3
  #   container_name: ptero_nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     # - ./nginx/conf.d:/etc/nginx/conf.d:ro
  #     # - pterodactyl-app:/var/www/html:ro
  #     - pterodactyl-app:/var/www/html:ro
  #     # 署名証明書を配置
  #     # - ./nginx/certs/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
  #     # - ./nginx/certs/privkey.pem:/etc/nginx/certs/privkey.pem:ro
  #   depends_on:
  #     - panel

  phpmyadmin:
    image: phpmyadmin
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:8081:80"
    environment:
      TZ: "Asia/Tokyo"
      PMA_HOST: ${PMA_HOST}
      PMA_USER: ${PMA_USER}
      PMA_PASSWORD: ${PMA_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared
    command:
      - tunnel
      - --no-autoupdate
      - run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
      - TUNNEL_TRANSPORT_PROTOCOL=${TUNNEL_TRANSPORT_PROTOCOL:-http2}
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    network_mode: service:panel

volumes:
  pterodactyl-app:
